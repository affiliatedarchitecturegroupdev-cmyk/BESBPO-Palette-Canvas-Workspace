name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + tests + gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: palette_canvas
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: palette_canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palette_canvas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://palette_canvas:devpassword@localhost:5432/palette_canvas
      # e2e drives the worker queue explicitly via POST /jobs/process.
      PC_QUEUE_POLL: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run tests (shared permission tests + API e2e against Postgres)
        run: npm test

      - name: LoC report
        run: bash scripts/loc.sh

      - name: Drift detection (ledger vs AGENTS.md rules)
        run: node scripts/drift-check.js

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: ops/drift/latest.md
          if-no-files-found: error